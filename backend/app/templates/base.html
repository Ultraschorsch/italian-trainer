<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Passaporto Italiano{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <span class="brand">🇮🇹 Passaporto Italiano</span>
    {% if profile %}
    <nav>
      <a href="/">Dashboard</a>
      <a href="/review">Üben</a>
      <a href="/timeline">Fortschritt</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="note">Selbstgehosteter Italienisch-Trainer &middot; keine externen Abhängigkeiten</footer>
  <script src="/static/app.js"></script>
</body>
</html>
