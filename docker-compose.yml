services:
  app:
    build: ./backend
    container_name: italian-trainer-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-italian}:${POSTGRES_PASSWORD:-italian}@db:5432/${POSTGRES_DB:-italian_trainer}
      SSO_HEADER_NAME: ${SSO_HEADER_NAME:-Remote-User}
      ALLOW_LOCAL_PROFILE_PICKER: ${ALLOW_LOCAL_PROFILE_PICKER:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      AUTO_EXPLAIN_ON_WRONG: ${AUTO_EXPLAIN_ON_WRONG:-true}
    ports:
      - "8090:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    # Kein lokales Traefik auf CT 102 -- Freigabe läuft wie bei den anderen
    # Diensten (pocket-id, open-webui) über einen gepublishten Host-Port +
    # eine Pangolin-Resource (Newt registriert 192.168.1.184:8090 als Target).

  db:
    image: postgres:16-alpine
    container_name: italian-trainer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-italian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-italian}
      POSTGRES_DB: ${POSTGRES_DB:-italian_trainer}
    volumes:
      - italian_trainer_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-italian}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  italian_trainer_db:
